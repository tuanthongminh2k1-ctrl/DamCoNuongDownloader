
name: Tao EXE TruyenSaver CocCoc v2.1 PDF

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python on GitHub
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.54,<2" "pillow>=11,<13" "reportlab>=4.2,<5" "pypdf>=5,<7" "pyinstaller>=6.10,<7"

      - name: Test source
        shell: pwsh
        run: |
          python -m py_compile app.py
          if (Test-Path tests) {
            python -m unittest discover -s tests -p "test_*.py" -v
          }

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TruyenSaver_CocCoc_v2_1 --collect-all playwright --collect-all PIL --collect-all reportlab --collect-all pypdf app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/TruyenSaver_CocCoc_v2_1.exe')) {
            throw 'EXE was not created'
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TruyenSaver-CocCoc-v2.1-Windows
          path: dist/TruyenSaver_CocCoc_v2_1.exe
          retention-days: 14
          if-no-files-found: error
