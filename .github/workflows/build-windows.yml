
name: Tao EXE TruyenPDF CocCoc v4

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python on GitHub runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf pyinstaller

      - name: Build standalone GUI EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TruyenPDF_CocCoc --collect-all playwright app.py

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: TruyenPDF-CocCoc-Windows
          path: dist/TruyenPDF_CocCoc.exe
          retention-days: 7
