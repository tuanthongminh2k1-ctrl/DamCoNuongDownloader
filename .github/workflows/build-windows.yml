
name: TruyenSaver PRO v4.1 DamCoNuong Optimized - Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack classic source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $target = Join-Path $root 'source'
          New-Item -ItemType Directory -Path $target -Force | Out-Null

          $archives = @(Get-ChildItem -LiteralPath $root -Filter '*.zip' -File)
          if ($archives.Count -eq 0) {
            throw 'Repository chua co file ZIP nao o thu muc goc'
          }

          $queue = [System.Collections.Generic.Queue[string]]::new()
          foreach ($file in $archives) {
            $queue.Enqueue($file.FullName)
          }

          $processed = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase
          )
          $found = $false
          $attempt = 0

          while ($queue.Count -gt 0 -and $attempt -lt 20 -and !$found) {
            $archive = $queue.Dequeue()
            if (-not $processed.Add($archive)) {
              continue
            }

            $attempt++
            $destination = Join-Path $root "_unpack_$attempt"

            Write-Host "Dang giai nen: $archive"
            Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force

            $apps = @(Get-ChildItem -LiteralPath $destination -Recurse -File -Filter 'app.py')

            foreach ($app in $apps) {
              $folder = $app.DirectoryName
              $requirements = Join-Path $folder 'requirements-build.txt'
              $tests = Join-Path $folder 'tests'

              if ((Test-Path $requirements) -and (Test-Path $tests)) {
                Copy-Item -Path (Join-Path $folder '*') -Destination $target -Recurse -Force
                Write-Host "Tim thay ma nguon tai: $folder"
                $found = $true
                break
              }
            }

            if (-not $found) {
              $nested = @(Get-ChildItem -LiteralPath $destination -Recurse -File -Filter '*.zip')

              foreach ($file in $nested) {
                Write-Host "Phat hien ZIP ben trong: $($file.Name)"
                $queue.Enqueue($file.FullName)
              }
            }
          }

          if (-not $found) {
            Write-Host 'Cac file da tim thay:'
            Get-ChildItem -LiteralPath $root -Directory -Filter '_unpack_*' | ForEach-Object {
              Get-ChildItem -LiteralPath $_.FullName -File -Recurse |
                Select-Object -First 40 -ExpandProperty FullName |
                ForEach-Object { Write-Host $_ }
            }
            throw 'Khong tim thay bo ma nguon co app.py, requirements-build.txt va tests'
          }

          if (!(Test-Path (Join-Path $target 'app.py'))) {
            throw 'Thieu app.py sau khi copy'
          }
          Write-Host 'Da tim va giai nen ma nguon thanh cong'

      - name: Setup Python on Windows runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw 'Upgrade pip failed'
          }

          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) {
            throw 'Install dependencies failed'
          }

      - name: Download Chromium for portable application
        shell: pwsh
        working-directory: source
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) {
            throw 'Chromium installation failed'
          }

          if (!(Test-Path $env:PLAYWRIGHT_BROWSERS_PATH)) {
            throw 'Chromium files missing'
          }

      - name: Validate source and run regression tests
        shell: pwsh
        working-directory: source
        run: |
          python -m py_compile app.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Python syntax invalid'
          }

          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) {
            throw 'Regression tests failed'
          }

          python tests/check_stop_real_browser.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Chromium stop test failed'
          }

      - name: Build Windows portable EXE
        shell: pwsh
        working-directory: source
        run: |
          $browserDir = Join-Path $env:GITHUB_WORKSPACE 'playwright-browsers'
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist'

          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name TruyenSaver_PRO_Classic `
            --distpath "$distDir" `
            --collect-all playwright --collect-all PIL --collect-all reportlab --collect-all pypdf `
            --add-data "$browserDir;playwright-browsers" app.py

          if ($LASTEXITCODE -ne 0) {
            throw 'PyInstaller build failed'
          }

      - name: Test built EXE with bundled browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'dist/TruyenSaver_PRO_Classic'
          $exe = Join-Path $dir 'TruyenSaver_PRO_Classic.exe'

          if (!(Test-Path $exe)) {
            throw 'Windows EXE missing'
          }

          if (!(Test-Path (Join-Path $dir '_internal/playwright-browsers'))) {
            throw 'Bundled browser missing'
          }

          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru

          if ($proc.ExitCode -ne 0) {
            $err = Join-Path $env:TEMP 'TruyenSaver_PRO_selftest_error.txt'
            if (Test-Path $err) {
              Get-Content $err
            }
            throw "Portable EXE self-test failed ($($proc.ExitCode))"
          }

          Write-Host 'EXE self-test passed'

      - name: Publish portable download
        uses: actions/upload-artifact@v4
        with:
          name: TruyenSaver-v4.1-DamCoNuong-Windows-Portable
          path: dist/TruyenSaver_PRO_Classic/
          retention-days: 14
          if-no-files-found: error
