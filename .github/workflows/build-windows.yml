
name: Tao EXE TruyenSaver Chromium v2.4

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Python on GitHub only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.54,<2" "pillow>=11,<13" "reportlab>=4.2,<5" "pypdf>=5,<7" "pyinstaller>=6.10,<7"

      - name: Download full Chromium into portable bundle
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:GITHUB_WORKSPACE 'playwright-browsers'
          python -m playwright install chromium
          if (-not (Test-Path $env:PLAYWRIGHT_BROWSERS_PATH)) {
            throw 'Chromium was not downloaded'
          }

      - name: Test sources
        shell: pwsh
        run: |
          python -m py_compile app.py
          if (Test-Path tests) {
            python -m unittest discover -s tests -p "test_*.py" -v
          }

      - name: Build GUI and bundle Chromium
        shell: pwsh
        run: |
          $browsers = Join-Path $env:GITHUB_WORKSPACE 'playwright-browsers'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name TruyenSaver_Chromium_v2_4 --collect-all playwright --collect-all PIL --collect-all reportlab --collect-all pypdf --add-data "$browsers;playwright-browsers" app.py

      - name: Verify portable browser and EXE
        shell: pwsh
        run: |
          $app = 'dist/TruyenSaver_Chromium_v2_4'
          if (-not (Test-Path "$app/TruyenSaver_Chromium_v2_4.exe")) {
            throw 'EXE missing'
          }
          if (-not (Test-Path "$app/_internal/playwright-browsers")) {
            throw 'Bundled Chromium missing'
          }

      - name: Upload portable Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: TruyenSaver-Chromium-v2.4-Portable
          path: dist/TruyenSaver_Chromium_v2_4/
          retention-days: 14
          if-no-files-found: error
