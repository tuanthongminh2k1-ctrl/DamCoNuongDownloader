
name: TruyenSaver PRO v5 - Verified Chapters - Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v5 source (including nested package)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'TruyenSaver_PRO_v5_Source.zip'
          $zip = Join-Path $env:GITHUB_WORKSPACE $name
          if (!(Test-Path $zip)) {
            $wrappers = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter '*.zip' -File)
            foreach ($wrapper in $wrappers) {
              $dest = Join-Path $env:GITHUB_WORKSPACE ('wrapper-' + $wrapper.BaseName)
              Expand-Archive -LiteralPath $wrapper.FullName -DestinationPath $dest -Force
              $candidate = Get-ChildItem -LiteralPath $dest -Filter $name -Recurse -File | Select-Object -First 1
              if ($candidate) {
                $zip = $candidate.FullName
                break
              }
            }
          }
          if (!(Test-Path $zip)) {
            Write-Host 'Root repository files:'
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -File | Select-Object -ExpandProperty Name
            throw "Khong tim thay $name. Can upload ZIP v5, khong phai ban v4.1."
          }
          Expand-Archive -LiteralPath $zip -DestinationPath source -Force
          if (!(Test-Path 'source/app.py') -or !(Test-Path 'source/chapter_v5.py')) {
            throw 'ZIP v5 sai cau truc; can app.py va chapter_v5.py tai thu muc goc trong ZIP'
          }
          if (!(Test-Path 'source/tests') -or !(Test-Path 'source/requirements-build.txt')) {
            throw 'ZIP v5 thieu tests hoac requirements-build.txt'
          }
          Write-Host 'V5 source extracted and checked.'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'dependency install failed' }

      - name: Install bundled Chromium
        shell: pwsh
        working-directory: source
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium download failed' }
          if (!(Test-Path $env:PLAYWRIGHT_BROWSERS_PATH)) { throw 'Browser directory missing' }

      - name: Run all regression tests including v5 sequential images
        shell: pwsh
        working-directory: source
        run: |
          python -m py_compile app.py chapter_v5.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          python tests/check_stop_real_browser.py
          if ($LASTEXITCODE -ne 0) { throw 'STOP smoke test failed' }

      - name: Build Windows Portable EXE
        shell: pwsh
        working-directory: source
        run: |
          $browser = Join-Path $env:GITHUB_WORKSPACE 'playwright-browsers'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name TruyenSaver_PRO_v5 --distpath "$dist" `
            --hidden-import chapter_v5 `
            --collect-all playwright --collect-all PIL --collect-all reportlab --collect-all pypdf `
            --add-data "$browser;playwright-browsers" --add-data "assets;assets" app.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }

      - name: Smoke-test bundled EXE and original-image PDF pipeline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:GITHUB_WORKSPACE 'dist/TruyenSaver_PRO_v5'
          $exe = Join-Path $folder 'TruyenSaver_PRO_v5.exe'
          if (!(Test-Path $exe)) { throw 'EXE missing' }
          if (!(Test-Path (Join-Path $folder '_internal/playwright-browsers'))) {
            throw 'Bundled Chromium missing'
          }
          $result = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            $log = Join-Path $env:TEMP 'TruyenSaver_PRO_selftest_error.txt'
            if (Test-Path $log) { Get-Content $log }
            throw "Bundled EXE self-test failed ($($result.ExitCode))"
          }
          Write-Host 'EXE browser and chapter image/PDF smoke test OK'

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: TruyenSaver-PRO-v5-Windows-Portable
          path: dist/TruyenSaver_PRO_v5/
          retention-days: 14
          if-no-files-found: error
