
name: Tao EXE Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 img2pdf pyinstaller

      - name: Tao EXE
        run: |
          pyinstaller --onefile --windowed --name DamCoNuongDownloader DamCoNuongDownloader.py

      - name: Luu EXE
        uses: actions/upload-artifact@v4
        with:
          name: DamCoNuongDownloader-Windows
          path: dist/DamCoNuongDownloader.exe
