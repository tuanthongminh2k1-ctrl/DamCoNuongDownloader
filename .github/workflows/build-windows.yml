
name: Tao EXE TruyenSaver PRO v3.0

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Python on GitHub runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.54,<2" "pillow>=11,<13" "reportlab>=4.2,<5" "pypdf>=5,<7" "pyinstaller>=6.10,<7"

      - name: Download Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:GITHUB_WORKSPACE 'playwright-browsers'
          python -m playwright install chromium
          if (-not (Test-Path $env:PLAYWRIGHT_BROWSERS_PATH)) {
            throw 'Chromium missing'
          }

      - name: Check source and tests
        shell: pwsh
        run: |
          python -m py_compile app.py
          if (Test-Path 'tests/test_v3_features.py') {
            python -m unittest discover -s tests -p 'test_*.py' -v
          }

      - name: Build EXE
        shell: pwsh
        run: |
          $browsers = Join-Path $env:GITHUB_WORKSPACE 'playwright-browsers'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name TruyenSaver_PRO_v3 --collect-all playwright --collect-all PIL --collect-all reportlab --collect-all pypdf --add-data "$browsers;playwright-browsers" app.py

      - name: Verify EXE and browser
        shell: pwsh
        run: |
          $dir = 'dist/TruyenSaver_PRO_v3'
          if (-not (Test-Path "$dir/TruyenSaver_PRO_v3.exe")) {
            throw 'EXE missing'
          }
          if (-not (Test-Path "$dir/_internal/playwright-browsers")) {
            throw 'Browser missing'
          }
          $exe = (Resolve-Path "$dir/TruyenSaver_PRO_v3.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) {
            throw "EXE self-test failed: $($test.ExitCode)"
          }

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: TruyenSaver-PRO-v3-Windows-Portable
          path: dist/TruyenSaver_PRO_v3/
          retention-days: 14
          if-no-files-found: error
